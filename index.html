/* Мобильное приложение в одну колонку. По умолчанию — «Изумруд»; сохранены светлая, тёмная и системная темы. Golos Text и Cormorant Garamond; в прежних темах Manrope и Lora. */
:root {
  --bg: #0b0a09; --surface: #151311; --surface2: #1d1a17; --fg: #f4ede1; --muted: #a39b8f;

  --olive: #a6c79b; --olive-b: rgba(166, 199, 155, .14);
  --gg: linear-gradient(135deg, var(--gold-hi) 0%, var(--gold) 48%, var(--gold-lo) 100%);
  --edge: linear-gradient(145deg, var(--gold-a), rgba(214, 178, 106, .05) 36%, rgba(214, 178, 106, .05) 64%, var(--gold-b));
  --display: "Lora", Georgia, "Times New Roman", serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px; --r-sm: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #fbf6ef; --surface: #ffffff; --surface2: #f3ebdf; --fg: #2b2118; --muted: #8a7a68;
  --line: rgba(70, 52, 22, .10); --gold: #e0623a; --gold-hi: #ec7e58; --gold-lo: #b9481f;
  --gold-a: rgba(224, 98, 58, .45); --gold-b: rgba(224, 98, 58, .14); --on-gold: #ffffff;
  --good: #5f7a3a; --warn: #b5741c; --shade: rgba(43, 33, 24, .32); --glow: rgba(224, 98, 58, .10);
  --gg: linear-gradient(var(--gold), var(--gold)); --edge: linear-gradient(var(--line), var(--line));
  --olive: #5f7a3a; --olive-b: rgba(95, 122, 58, .12);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #fbf6ef; --surface: #ffffff; --surface2: #f3ebdf; --fg: #2b2118; --muted: #8a7a68;
  --line: rgba(70, 52, 22, .10); --gold: #e0623a; --gold-hi: #ec7e58; --gold-lo: #b9481f;
  --gold-a: rgba(224, 98, 58, .45); --gold-b: rgba(224, 98, 58, .14); --on-gold: #ffffff;
  --good: #5f7a3a; --warn: #b5741c; --shade: rgba(43, 33, 24, .32); --glow: rgba(224, 98, 58, .10);
  --gg: linear-gradient(var(--gold), var(--gold)); --edge: linear-gradient(var(--line), var(--line));
  --olive: #5f7a3a; --olive-b: rgba(95, 122, 58, .12);
  color-scheme: light; }
/* акценты */
:root[data-accent="champagne"] { --gold: #d9c39a; --gold-hi: #f2e5c6; --gold-lo: #a38c63; --gold-a: rgba(217, 195, 154, .6); --gold-b: rgba(217, 195, 154, .16); }

:root[data-theme="light"][data-accent="rose"] { --gold: #a8624d; --gold-hi: #c98670; --gold-lo: #7f4636; --gold-a: rgba(168, 98, 77, .55); --gold-b: rgba(168, 98, 77, .2); }
@media (prefers-color-scheme: light) {
  :root:not([data-theme])[data-accent="champagne"] { --gold: #9b8150; --gold-hi: #bfa36c; --gold-lo: #765f36; --gold-a: rgba(155, 129, 80, .6); --gold-b: rgba(155, 129, 80, .2); }
  :root:not([data-theme])[data-accent="rose"] { --gold: #a8624d; --gold-hi: #c98670; --gold-lo: #7f4636; --gold-a: rgba(168, 98, 77, .55); --gold-b: rgba(168, 98, 77, .2); }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: var(--r); border: 1px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--edge) border-box; margin-bottom: 14px; }

.strip::-webkit-scrollbar { display: none; }
